server:
  port: 7004

spring:
  application:
    name: chat-service

  datasource:
    url: jdbc:mysql://localhost:3306/carverse_chatdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

redis:
  host: localhost
  port: 6379

# ✅ INTERNAL TOKEN (must be OUTSIDE spring:)
internal:
  token: ${INTERNAL_SERVICE_TOKEN}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

notification:
  base-url: http://localhost:7003
  enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 900000
  refresh-expiration-ms: 604800000

logging:
  level:
    root: INFO
    org.flywaydb: INFO
